services:
  # ProverbSeed: Sert les fichiers compilés (dist) par Nginx
  proverbseed:
    build: .
    container_name: proverbseed
    volumes:
      # On garde uniquement la config Nginx si on veut pouvoir la modifier sans rebuild, 
      # mais elle est déjà copiée dans le Dockerfile. On peut la laisser pour le dev.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.docker.allownonrunning=true"
      - traefik.http.routers.proverbseed.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.proverbseed.tls=true
      - traefik.http.routers.proverbseed.entrypoints=websecure
      - traefik.http.routers.proverbseed.tls.certresolver=letsencrypt
      - traefik.http.middlewares.proverbseed.headers.sslredirect=true
      - traefik.http.middlewares.proverbseed.headers.stsseconds=315360000
      - traefik.http.middlewares.proverbseed.headers.browserxssfilter=true
      - traefik.http.middlewares.proverbseed.headers.contenttypenosniff=true
      - traefik.http.middlewares.proverbseed.headers.forcestsheader=true
      - traefik.http.middlewares.proverbseed.headers.sslhost=${DOMAIN_NAME}
      - traefik.http.middlewares.proverbseed.headers.stsincludesubdomains=true
      - traefik.http.middlewares.proverbseed.headers.stspreload=true
      - traefik.http.routers.proverbseed.middlewares=proverbseed@docker, proverbseed-sablier@docker
      - traefik.http.services.proverbseed.loadbalancer.server.port=80
      # Sablier Integration
      - "sablier.enable=true"
      - "sablier.group=proverbseed"
      - "traefik.http.middlewares.proverbseed-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.proverbseed-sablier.plugin.sablier.names=proverbseed"
      - "traefik.http.middlewares.proverbseed-sablier.plugin.sablier.sessionDuration=5m"
      - "traefik.http.middlewares.proverbseed-sablier.plugin.sablier.dynamic.theme=ghost"
      - "traefik.http.middlewares.proverbseed-sablier.plugin.sablier.dynamic.showDetails=true"

networks:
  proxy:
    external: true
